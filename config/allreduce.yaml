ocssName: ocss # OCSS name
configuration:
  networkManager: 
    packetSwitchs:
      - device: switch1
        id: 1
        ports: 1,3,4,17,19,20,25,27,28,33
      - device: switch2
        id: 5
        ports: 5,6,7,21,22,23,29,30,31,33
    opticalSwitchs:
      - device: ocs
        ports: 1,3,4,69,71,72,16,31,37,38,39,65,66,67
        ip: 10.224.92.88
    servers:
      - name: server1
        ip: 192.168.50.111
        port: 111
      - name: server2
        ip: 192.168.50.113
        port: 113
      - name: server3
        ip: 192.168.50.114
        port: 114
      - name: server4
        ip: 192.168.50.147
        port: 147
      - name: server5
        ip: 192.168.50.148
        port: 148
      - name: server6
        ip: 192.168.50.149
        port: 149
    links:
      - source: server1
        destination: switch1
        sourcePorts: 111
        destinationPorts: 1
      - source: server2
        destination: switch1
        sourcePorts: 113
        destinationPorts: 3
      - source: server3
        destination: switch1
        sourcePorts: 114
        destinationPorts: 4
      - source: switch1
        destination: ocs
        sourcePorts: 17,19,20,25,27,28,33
        destinationPorts: 1,3,4,69,71,72,16
      - source: switch2
        destination: ocs
        sourcePorts: 33,29,30,31,21,22,23
        destinationPorts: 31,65,66,67,37,38,39
      - source: switch2
        destination: server4
        sourcePorts: 5
        destinationPorts: 147
      - source: switch2
        destination: server5
        sourcePorts: 6
        destinationPorts: 148
      - source: switch2
        destination: server6
        sourcePorts: 7
        destinationPorts: 149
    fowarder:
        name: ryu
        address: http://127.0.0.1:8010
    appServer:
      name: app
      ip: 10.224.92.112
      port: 8081
  user:
    link:
      - source: server1
        destination: ocs_edge
        sourcePorts: 111
        destinationPorts: 1
      - source: server2
        destination: ocs_edge
        sourcePorts: 113
        destinationPorts: 3
      - source: server3
        destination: ocs_edge
        sourcePorts: 114
        destinationPorts: 4
      - source: server4
        destination: ocs_edge
        sourcePorts: 147
        destinationPorts: 37
      - source: server5
        destination: ocs_edge
        sourcePorts: 148
        destinationPorts: 38
      - source: server6
        destination: ocs_edge
        sourcePorts: 149
        destinationPorts: 39
    tor:
      - device: switch1
        tors:
          - name: tor1
            ports: 25,27,28,33
      - device: switch2
        tors:
          - name: tor2
            ports: 29,30,31,33
    ocs:
      - device: ocs
        sections:
          - name: ocs_edge
            ports: 1,3,4,37,38,39,69,71,72,65,66,67
            sourcePorts: 1,3,4,37,38,39
            destinationPorts: 69,71,72,65,66,67
          - name: ocs_core
            ports: 16,31 
            sourcePorts: 16
            destinationPorts: 31
logger: # Log output settings
  enable: true # true or false
  level: info # Trace levels: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # Enable the caller report: true or false
